name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New advisories are published against existing versions, so audit
  # periodically even when the lockfile hasn't changed.
  schedule:
    - cron: "0 6 * * *"

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
